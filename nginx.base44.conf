# Base44 sandbox server for the static portfolio.
#
# Mounted at /etc/nginx/nginx.conf. This is a full main config rather than a
# conf.d drop-in for one reason: the bind-mounted repo root is mode 0700, so the
# default `user nginx` workers cannot traverse it (403/404 on every request).
# Running the workers as root lets nginx read the mount unchanged, without
# loosening permissions on the repository itself.
#
# The site is plain HTML/CSS/JS with no build step, so edits appear on refresh.

user  root;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $request $status $body_bytes_sent';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    charset         utf-8;
    charset_types   text/css application/javascript image/svg+xml;

    gzip  on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen       3000;
        listen       [::]:3000;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # never expose repo metadata or tooling files over HTTP
        location ~ /\. {
            deny all;
        }

        location ~* \.(ya?ml|md|json|lock|conf)$ {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store, must-revalidate";
        }

        location ~* \.(css|js|svg|woff2?)$ {
            try_files $uri =404;
            add_header Cache-Control "no-store, must-revalidate";
        }

        location ~* \.(mp3|ogg|wav)$ {
            add_header Cache-Control "public, max-age=3600";
        }
    }
}
