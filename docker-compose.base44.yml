name: base44-static-site

services:
  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      # Serve the cloned source directly so edits show up immediately.
      - ./:/app
    environment:
      - NODE_ENV=development
    command:
      - sh
      - -ec
      - |
        npm install -g live-server@1.2.2 --no-fund --no-audit >/dev/null
        exec live-server /app \
          --host=0.0.0.0 \
          --port=3000 \
          --no-browser \
          --wait=200 \
          --entry-file=index.html \
          --ignore=.git
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:3000/index.html -o /dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 45s
